<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💞もずれんらくちょう💕 - もずべや</title>
    <style>
        body {
            background-color: #efefef;
            color: #000000;
            font-family: "MS PGothic", "ＭＳ Ｐゴシック", "Mona", IPAMonaGothic, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            font-size: 15px;
            line-height: 1.4;
        }
        h1 {
            color: #cc0000;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
        }
        .thread-container {
            background-color: #ffffff;
            border: 1px solid #808080;
            padding: 15px;
            margin-bottom: 20px;
        }
        .post-card {
            margin-bottom: 16px;
            word-break: break-all;
        }
        .post-header {
            color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .post-meta {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-num {
            font-weight: bold;
            color: #000000;
        }
        .post-name {
            color: #117743;
            font-weight: bold;
        }
        .post-time {
            color: #444444;
            font-size: 0.9rem;
        }
        .delete-btn {
            background: #ffe4e1;
            border: 1px solid #ffb6c1;
            color: #c71585;
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
        }
        .delete-btn:hover {
            background: #ffb6c1;
            color: #fff;
        }
        .post-body {
            margin-top: 4px;
            margin-left: 18px;
            white-space: pre-wrap;
            color: #000000;
        }
        .form-box {
            background: #e0e0e0;
            border: 1px solid #808080;
            padding: 12px;
            margin-top: 20px;
        }
        .form-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #333;
        }
        .input-group {
            margin-bottom: 8px;
        }
        input[type="text"], textarea {
            font-family: inherit;
            border: 1px solid #7f9db9;
            padding: 4px 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        input[type="text"] {
            width: 250px;
            max-width: 100%;
        }
        textarea {
            width: 100%;
            height: 90px;
            resize: vertical;
            display: block;
        }
        button {
            background: #e0e0e0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 3px 15px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }
        button:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }
    </style>
</head>
<body>

    <h1>💞もずれんらくちょう💕</h1>

    <div class="thread-container" id="postList">
        <div style="color:#666;">スレッドを一生懸命読み込み中なの…待っててねっ💦</div>
    </div>

    <div class="form-box">
        <div class="form-title">■ レスを書くのっ！✍️</div>
        <div class="input-group">
            お名前：<input type="text" id="username" value="名無しさん＠お腹いっぱい。">
        </div>
        <div class="input-group">
            <textarea id="message" placeholder="可愛いメッセージを入力してね…！🥺"></textarea>
        </div>
        <button id="sendBtn">書き込むのっ！ 🚀</button>
    </div>

    <!-- Firebase SDK の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 管理者用パスワード
        const ADMIN_PASSWORD = "mozuku1023";

        // Firebaseの設定
        const firebaseConfig = {
            apiKey: "AIzaSyBt0ECZZ0FlI7CCNr16YARDzekn-ZmaL84",
            authDomain: "mozubeya-bbs.firebaseapp.com",
            projectId: "mozubeya-bbs",
            storageBucket: "mozubeya-bbs.firebasestorage.app",
            messagingSenderId: "710880749875",
            appId: "1:710880749875:web:75f17e1f78086c558bb646",
            measurementId: "G-F692FV8Q11"
        };

        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsRef = collection(db, "posts");

        // 投稿のリアルタイム取得＆自動表示
        const q = query(postsRef, orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const postList = document.getElementById("postList");
            postList.innerHTML = "";

            if (snapshot.empty) {
                postList.innerHTML = '<div style="color:#666;">まだレスが誰もいないみたい…一番乗りしちゃおっ？✨</div>';
                return;
            }

            let index = 1;
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                const time = data.createdAt ? formatDate(new Date(data.createdAt.seconds * 1000)) : "送信中なの…⏳";

                const card = document.createElement("div");
                card.className = "post-card";
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-meta">
                            <span class="post-num">${index}</span> ：<span class="post-name">${escapeHtml(data.name)}</span>：<span class="post-time">${time}</span>
                        </div>
                        <button class="delete-btn" onclick="deletePost('${docId}')">🗑️ 削除</button>
                    </div>
                    <div class="post-body">${escapeHtml(data.message)}</div>
                `;
                postList.appendChild(card);
                index++;
            });
        });

        // 削除用グローバル関数
        window.deletePost = async function(docId) {
            const inputPass = prompt("ここは管理者さん専用のお部屋だよっ！パスワードを教えてね？🔑");
            if (inputPass === null) return;

            if (inputPass !== ADMIN_PASSWORD) {
                alert("パスワードが違うよっ！勝手に消しちゃダメなんだからねっ❌");
                return;
            }

            if (!confirm("このレス、本当にキレイさっぱり消しちゃってもいいの…？🥺")) {
                return;
            }

            try {
                await deleteDoc(doc(db, "posts", docId));
                alert("ぽんっ！キレイに消去完了したよっ🗑️✨");
            } catch (error) {
                console.error("削除エラー:", error);
                alert("むー、上手く消せなかったみたい…: " + error.message);
            }
        };

        // 書き込み処理
        document.getElementById("sendBtn").addEventListener("click", async () => {
            const nameInput = document.getElementById("username");
            const msgInput = document.getElementById("message");

            const name = nameInput.value.trim() || "名無しさん＠お腹いっぱい。";
            const message = msgInput.value.trim();

            if (!message) {
                alert("むーっ！本文が入っていないよ、何か書いてね？🥺");
                return;
            }

            try {
                await addDoc(postsRef, {
                    name: name,
                    message: message,
                    createdAt: serverTimestamp()
                });
                msgInput.value = "";
            } catch (error) {
                console.error("投稿エラー:", error);
                alert("えーん、書き込みに失敗しちゃった…: " + error.message);
            }
        });

        // 日時フォーマット変換
        function formatDate(date) {
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const dayName = days[date.getDay()];
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            return `${y}/${m}/${d}(${dayName}) ${hh}:${mm}:${ss}`;
        }

        // 安全対策（HTMLエスケープ）
        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
