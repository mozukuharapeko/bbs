<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💞もずれんらくちょう💕 - もずべや</title>
    <style>
        body {
            background-color: #efefef;
            color: #000000;
            font-family: "MS PGothic", "ＭＳ Ｐゴシック", "Mona", IPAMonaGothic, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
            font-size: 15px;
            line-height: 1.4;
        }
        h1 {
            color: #cc0000;
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 2px solid #808080;
            padding-bottom: 5px;
        }
        .thread-container {
            background-color: #ffffff;
            border: 1px solid #808080;
            padding: 15px;
            margin-bottom: 20px;
        }
        .post-card {
            margin-bottom: 16px;
            word-break: break-all;
        }
        .post-header {
            color: #000000;
        }
        .post-num {
            font-weight: bold;
            color: #000000;
        }
        .post-name {
            color: #117743;
            font-weight: bold;
        }
        .post-time {
            color: #444444;
            font-size: 0.9rem;
        }
        .post-body {
            margin-top: 4px;
            margin-left: 18px;
            white-space: pre-wrap;
            color: #000000;
        }
        .form-box {
            background: #e0e0e0;
            border: 1px solid #808080;
            padding: 12px;
            margin-top: 20px;
        }
        .form-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #333;
        }
        .input-group {
            margin-bottom: 8px;
        }
        input[type="text"], textarea {
            font-family: inherit;
            border: 1px solid #7f9db9;
            padding: 4px 6px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        input[type="text"] {
            width: 250px;
            max-width: 100%;
        }
        textarea {
            width: 100%;
            height: 90px;
            resize: vertical;
            display: block;
        }
        button {
            background: #e0e0e0;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            padding: 3px 15px;
            font-size: 14px;
            cursor: pointer;
            font-family: inherit;
        }
        button:active {
            border-color: #808080 #ffffff #ffffff #808080;
        }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #0000cc;
            text-decoration: underline;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: #ff0000;
        }
    </style>
</head>
<body>

    <h1>💞もずれんらくちょう💕</h1>

    <div class="thread-container" id="postList">
        <div style="color:#666;">スレッドを読み込み中...</div>
    </div>

    <div class="form-box">
        <div class="form-title">■ レスを書く</div>
        <div class="input-group">
            名前：<input type="text" id="username" value="名無しさん＠お腹いっぱい。">
        </div>
        <div class="input-group">
            <textarea id="message" placeholder="書き込み内容を入力..."></textarea>
        </div>
        <button id="sendBtn">書き込む</button>
    </div>

    <!-- 修正箇所：index.html まで直接指定 -->
    <a href="https://mozukuharapeko.github.io/index.html" class="back-link">← もずべやトップに戻る</a>

    <!-- Firebase SDK の読み込み -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebaseの設定
        const firebaseConfig = {
            apiKey: "AIzaSyBt0ECZZ0FlI7CCNr16YARDzekn-ZmaL84",
            authDomain: "mozubeya-bbs.firebaseapp.com",
            projectId: "mozubeya-bbs",
            storageBucket: "mozubeya-bbs.firebasestorage.app",
            messagingSenderId: "710880749875",
            appId: "1:710880749875:web:75f17e1f78086c558bb646",
            measurementId: "G-F692FV8Q11"
        };

        // Firebaseの初期化
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const postsRef = collection(db, "posts");

        // 投稿のリアルタイム取得＆自動表示（2ch風に古い順＝上から下へ番号順）
        const q = query(postsRef, orderBy("createdAt", "asc"));
        onSnapshot(q, (snapshot) => {
            const postList = document.getElementById("postList");
            postList.innerHTML = "";

            if (snapshot.empty) {
                postList.innerHTML = '<div style="color:#666;">まだレスがありません。1ゲットのチャンス！</div>';
                return;
            }

            let index = 1;
            snapshot.forEach((doc) => {
                const data = doc.data();
                const time = data.createdAt ? formatDate(new Date(data.createdAt.seconds * 1000)) : "送信中...";

                const card = document.createElement("div");
                card.className = "post-card";
                card.innerHTML = `
                    <div class="post-header">
                        <span class="post-num">${index}</span> ：<span class="post-name">${escapeHtml(data.name)}</span>：<span class="post-time">${time}</span>
                    </div>
                    <div class="post-body">${escapeHtml(data.message)}</div>
                `;
                postList.appendChild(card);
                index++;
            });
        });

        // 書き込み処理
        document.getElementById("sendBtn").addEventListener("click", async () => {
            const nameInput = document.getElementById("username");
            const msgInput = document.getElementById("message");

            const name = nameInput.value.trim() || "名無しさん＠お腹いっぱい。";
            const message = msgInput.value.trim();

            if (!message) {
                alert("本文が入っていません！");
                return;
            }

            try {
                await addDoc(postsRef, {
                    name: name,
                    message: message,
                    createdAt: serverTimestamp()
                });
                msgInput.value = "";
            } catch (error) {
                console.error("投稿エラー:", error);
                alert("書き込みに失敗しました。");
            }
        });

        // 2ch風の日時フォーマット変換 (例: 2026/10/30(金) 17:30:00)
        function formatDate(date) {
            const days = ["日", "月", "火", "水", "木", "金", "土"];
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            const dayName = days[date.getDay()];
            const hh = String(date.getHours()).padStart(2, '0');
            const mm = String(date.getMinutes()).padStart(2, '0');
            const ss = String(date.getSeconds()).padStart(2, '0');
            return `${y}/${m}/${d}(${dayName}) ${hh}:${mm}:${ss}`;
        }

        // 安全対策（HTMLエスケープ）
        function escapeHtml(str) {
            if (!str) return "";
            return str.replace(/&/g, '&amp;')
                      .replace(/</g, '&lt;')
                      .replace(/>/g, '&gt;')
                      .replace(/"/g, '&quot;')
                      .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
